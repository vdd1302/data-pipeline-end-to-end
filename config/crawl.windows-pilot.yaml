version: 1
project:
  name: it_job_market_pipeline
  timezone: Asia/Ho_Chi_Minh
source:
  id: topcv
  base_url: https://www.topcv.vn
  entry_url: https://www.topcv.vn/tim-viec-lam-cong-nghe-thong-tin-cr257
  method: selenium_ui
  language: vi
scope:
  sector: IT
  sector_filter_mode: ui_category
  sector_search_label: Công nghệ Thông tin
  require_sector_filter: true
  on_missing_filter: stop_and_log
  location_ui_mode: Tỉnh, Quận/huyện cũ
  require_location_filter: true
  verify_filters_after_navigation: true
  locations:
  - id: ha_noi
    search_label: Hà Nội
  - id: ho_chi_minh
    search_label: Hồ Chí Minh
  positions:
  - id: software_engineer
    keyword: Software Engineer
  - id: backend_developer
    keyword: Back-End Developer
  - id: data_analyst
    keyword: Data Analyst
  - id: fullstack_developer
    keyword: Full-Stack Developer
  - id: ai_engineer
    keyword: AI Engineer
  - id: data_scientist
    keyword: Data Scientist
  - id: data_engineer
    keyword: Data Engineer
  - id: devops_engineer
    keyword: DevOps Engineer
  - id: cybersecurity_specialist
    keyword: Cybersecurity Specialist
  - id: business_analyst
    keyword: Business Analyst
crawl:
  enabled: true
  query_strategy: cross_product
  collect:
  - listing
  - detail
  scope_priority: default
  max_pages_per_query: 5
  max_jobs_per_query: null
  max_details_per_batch: 25
  scope_detail_quantum: 25
  worker_time_budget_seconds: 1500
  min_navigation_interval_seconds: 15
  # Interactive Windows pilot is operator-initiated; do not block manual restarts with a 15m unattended gap.
  min_session_gap_seconds: 0
  micro_batch_pause_seconds: 45
  listing_pages_per_slice: 1
  scope_retry_limit: 3
  job_retry_limit: 2
  lease_seconds: 180
  scope_retry_delay_seconds: 300
  rate_limit_backoff_seconds: 900
  seed_batches_only_from_daily_dag: true
  preserve_pending_across_midnight: true
  allow_partial_detail: true
  allow_verified_listing_only: true
  hard_denial_requires_review: true
  stop_when_no_next_page: true
  stop_when_repeated_page: true
  checkpoint_enabled: true
  checkpoint_directory: data/checkpoints/topcv
  resume_after_failure: true
  auto_resume_after_access_block: false
  deduplicate_within_run: true
  deduplication_key:
  - source_code
  - source_job_id
  retain_search_matches: true
  preserve_observations_across_runs: true
selenium:
  browser: chrome
  headless: false
  browser_instances: 1
  browser_profile_dir: browser_profile/topcv_windows_pilot
  page_load_timeout_seconds: 40
  explicit_wait_seconds: 25
  delay_between_pages_seconds: 15
  delay_between_jobs_seconds: 18
  max_retries: 2
  retry_backoff_seconds:
  - 30
  - 60
  retry_on:
  - navigation_timeout
  - transient_navigation_error
  on_challenge: pause_for_manual_verification
  manual_verification_timeout_seconds: 600
  verification_poll_interval_seconds: 2
  require_target_page_after_verification: true
  on_verification_timeout: checkpoint_and_stop
  on_access_denied: checkpoint_and_stop
  retry_on_challenge: false
  on_unexpected_dialog: stop_and_log
anti_bot:
  detection_enabled: true
  challenge_title_markers:
  - just a moment
  - checking your browser
  - attention required
  challenge_body_markers:
  - verify you are human
  - verifying you are human
  - checking your browser
  - xác minh bạn là con người
  access_denied_markers:
  - sorry, you have been blocked
  - you are unable to access topcv.vn
  - access denied
  - error 1020
  on_http_403: checkpoint_and_stop
  on_http_429: checkpoint_and_stop
  honor_retry_after: true
extraction:
  identity_fields:
  - source_job_id
  - job_url
  required_fields:
  - job_title_raw
  - company_name_raw
  - location_raw
  - job_description_raw
  - job_requirements_raw
  optional_fields:
  - salary_raw
  - experience_raw
  - posted_date_raw
  - deadline_raw
  - company_url_raw
  - company_size_raw
  - company_industry_raw
  - skill_tags_raw
  - benefits_raw
  - job_level_raw
  generated_fields:
  - source_code
  - crawl_run_id
  - snapshot_date
  - scraped_at
  - content_hash
  - fetch_status
  - parser_version
  allow_null_optional_fields: true
raw_storage:
  engine: postgresql
  connection_url_env: TOPCV_RAW_DATABASE_URL
  schema: raw
  tables:
    runs: crawl_runs
    discoveries: job_discoveries
    observations: job_observations
    errors: crawl_errors
  search_match_fields:
  - query_city_raw
  - query_category_raw
  - search_page_no
  - result_position
  payload_column: raw_payload
  payload_type: jsonb
  history_mode: append_observations
logging:
  level: INFO
  directory: logs
