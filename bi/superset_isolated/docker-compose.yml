# A6.1D NEW ISOLATED Superset metadata, independent of A3.1/A5.4 port 8089.
name: topcv-a61d-superset-isolated
services:
  superset:
    image: apache/superset:6.1.0-dev
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Create local .env first}
      SUPERSET_CONFIG_PATH: /app/a61d_config/superset_config.py
      PYTHONPATH: /app/a61d_config
    ports:
      - '127.0.0.1:8090:8088'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - a61d_superset_metadata:/app/superset_home
      - ./superset_config.py:/app/a61d_config/superset_config.py:ro
    command: ['superset','run','-h','0.0.0.0','-p','8088','--with-threads']
volumes:
  a61d_superset_metadata:
